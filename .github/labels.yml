# Labels for the ShadowScan issue tracker.
#
# The Labels workflow (.github/workflows/labels.yml) creates or updates every
# label listed here on each push to main that changes this file; it never
# deletes a label. Issue forms, dependabot.yml and stale.yml may only apply or
# exempt labels that exist here (tests/test_repository_policy.py checks this).
# Retire a label by removing it here and deleting it in the repository by hand.

# Type
- name: bug
  color: "d73a4a"
  description: Something is not working correctly.

- name: enhancement
  color: "a2eeef"
  description: New feature or request.

- name: refactor
  color: "c2e0c6"
  description: Restructures code or documents without intending a change in behavior.

- name: connector-request
  color: "0075ca"
  description: Request for a new connector.

- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation.

- name: security
  color: "e4e669"
  description: Security-related change or report.

- name: detection
  color: "fbca04"
  description: False positive, false negative, misattribution, or scoring report.

- name: performance
  color: "1d76db"
  description: Speed or resource usage improvement.

- name: question
  color: "d876e3"
  description: Usage question about installation, configuration, or results.

# Priority
- name: "priority: critical"
  color: "b60205"
  description: Must be fixed immediately.

- name: "priority: high"
  color: "d93f0b"
  description: Important, should be fixed soon.

# Surface
- name: "surface: code"
  color: "c5def5"
  description: Code connectors (filesystem, GitHub, GitLab).

- name: "surface: identity"
  color: "c5def5"
  description: Identity connectors (Okta, Entra, Google, Auth0, JWT).

- name: "surface: gateway"
  color: "c5def5"
  description: Gateway connectors (logs, OTLP spans).

- name: "surface: lowcode"
  color: "c5def5"
  description: Low-code connectors (Power Platform, Salesforce, ServiceNow, etc).

- name: "surface: saas"
  color: "c5def5"
  description: SaaS connectors (Slack, Teams, GitHub Apps, etc).

- name: "surface: cloud"
  color: "c5def5"
  description: Cloud connectors (AWS, GCP, Azure, OCI).

- name: "surface: endpoint"
  color: "c5def5"
  description: Endpoint connectors (workstation host, MCP, model and eBPF inventories).

- name: "surface: network"
  color: "c5def5"
  description: Network connector (DNS, TLS and flow logs).

- name: "surface: runtime"
  color: "c5def5"
  description: Runtime connector (process exports).

# Status
- name: "good first issue"
  color: "7057ff"
  description: Good for newcomers.

- name: "help wanted"
  color: "008672"
  description: Extra attention is needed.

- name: stale
  color: "ffffff"
  description: Automatically marked as stale.

- name: pinned
  color: "006b75"
  description: Exempt from stale-issue automation.

# Resolution (GitHub's defaults, kept so the sync owns their wording)
- name: duplicate
  color: "cfd3d7"
  description: Duplicates an existing issue or pull request; the closing comment links it.

- name: invalid
  color: "e4e669"
  description: Not a valid report or change, for example a pull request that must not merge as is.

- name: wontfix
  color: "ffffff"
  description: Will not be worked on or merged; the closing comment gives the reason.

# Pull request triage
- name: breaking-change
  color: "b60205"
  description: Changes CLI, configuration, output, exit-code or finding-identity behavior users rely on.

- name: do-not-merge
  color: "000000"
  description: Must not merge yet; the pull request states what it waits for.

- name: coding-assistant
  color: "5319e7"
  description: Written by a coding assistant (Claude Code, Codex or Copilot); not independent review.

- name: "review: coding-assistant"
  color: "d4c5f9"
  description: Reviewed, or review requested, by a coding assistant (Copilot code review); not human review.

- name: "review: human-requested"
  color: "fbca04"
  description: Review requested from a human collaborator; no approval from them yet.

- name: "review: human-approved"
  color: "0e8a16"
  description: Approved by a human other than the author.

- name: integration
  color: "1d76db"
  description: Combines other pull requests into one change.

- name: superseded
  color: "cfd3d7"
  description: Closed unmerged; the change landed through another pull request or was replaced.

- name: review-fix
  color: "fef2c0"
  description: Fixes findings from a review; does not by itself show independent human review.

- name: regression-fix
  color: "e99695"
  description: Restores behavior that previously worked.

- name: fail-closed
  color: "b60205"
  description: Makes limits, malformed input or denied access mark the scan incomplete (exit 3).

- name: trust-boundary
  color: "d93f0b"
  description: Changes an authentication, origin, privilege or input trust boundary.

- name: redaction
  color: "f9d0c4"
  description: Credential redaction, secret handling or output sanitization.

- name: benchmark
  color: "c2e0c6"
  description: Evaluation corpora, benchmarks or measured detection accuracy.

- name: ci-cd
  color: "0e8a16"
  description: GitHub Actions workflows, build, release or repository gates.

- name: community
  color: "bfdadc"
  description: Community health files, templates and contributor guidance.

# AI review gate (docs/security/ai-review-gate.md)
- name: "ai-review: blocked"
  color: "b60205"
  description: Maintainer block; the gate's next run on an evidence-carrying PR fails (review stays a comment).

- name: "ai-review: high-risk"
  color: "d93f0b"
  description: Require additional security evidence; never an approval override.

# Dependencies
- name: dependencies
  color: "0366d6"
  description: Pull requests that update a dependency.

- name: python
  color: "2b67c6"
  description: Python dependency update.

- name: github-actions
  color: "000000"
  description: GitHub Actions dependency update.

- name: docker
  color: "0db7ed"
  description: Docker dependency update.
