name: Connector inventory

# Weekly drift check of docs/connectors/inventory.json against the connector
# code, guides and tools/connector_inventory.yaml. The check job runs repository
# code with a read-only token. Only the separate report job, which checks out
# nothing and runs no repository code, may write, and only to one tracking issue.
on:
  schedule:
    - cron: "17 5 * * 1"  # Monday 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connector-inventory
  cancel-in-progress: false

jobs:
  check:
    name: Regenerate and compare the connector inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install from the hash locks
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock -r requirements-build.lock -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Check the inventory is current
        run: |
          set -euo pipefail
          python -m tools.connector_inventory --check
  report:
    name: Open or update the drift tracking issue
    needs: check
    if: failure() && github.repository_id == '1174915264'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update one tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Connector inventory drift"
          body="The scheduled connector inventory check failed: docs/connectors/inventory.json no longer matches the connectors. Run \`make connector-inventory\`, review the diff and commit it. Run: $RUN_URL"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
