name: Discovery benchmark
# Weekly regression gate for ShadowScan's code.filesystem connector on the
# pinned public corpus in benchmarks/shadow-ai-discovery. Only ShadowScan runs
# here; the third-party tools are installed and run locally (see the README).
# The gate fails when in-scope F1 drops more than one point, repository-level
# recall drops, a control or near-miss repository that the committed baseline
# left clean is flagged, or a repository scanned completely in the baseline is
# now incomplete (exit 3). A dispatched subset of repositories is compared with
# the same repositories of the baseline. The baseline is the committed run that
# BASELINE_RUN names, never whichever results directory sorts last, so a later
# directory in the companion (another tool's run, a re-score, an independent
# submission) cannot become the baseline unnoticed. Checkouts are read-only
# inputs; nothing in them is executed.
on:
  schedule:
    - cron: "23 6 * * 3"  # Wednesday 06:23 UTC
  workflow_dispatch:
    inputs:
      repos:
        description: "Comma-separated corpus repo ids (default: all)"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  # A dispatched subset run gets its own group, so it neither cancels nor
  # waits for the weekly run whose artifacts are the comparison record.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: false
jobs:
  shadowscan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # The companion's benchmarks/shadow-ai-discovery/results/<run>/ the gate
      # compares against. Move it only in a reviewed change that says why.
      BASELINE_RUN: "2026-10-09"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the hash-locked runtime and development toolchain
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Initialize and verify the exact companion revision
        run: |
          git submodule update --init --depth 1 -- benchmark-suite
          python -m tools.benchmark_suite
          cd benchmark-suite
          python -m tools.verify_migration
      - name: Fetch the pinned corpus
        working-directory: benchmark-suite
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          python -m tools.discovery_benchmark fetch \
            --corpus benchmarks/shadow-ai-discovery/corpus.json --dest "$RUNNER_TEMP/corpus"
      - name: Write the tool configuration
        run: |
          printf '{"tools": {"shadowscan": {"bin": "%s"}}}\n' "$(command -v shadowscan)" > "$RUNNER_TEMP/tools.json"
      - name: Run ShadowScan on the corpus
        working-directory: benchmark-suite
        env:
          REPOS: ${{ inputs.repos }}
        run: |
          extra=()
          if [ -n "$REPOS" ]; then extra=(--repos "$REPOS"); fi
          python -m tools.discovery_benchmark run \
            --corpus benchmarks/shadow-ai-discovery/corpus.json --tools "$RUNNER_TEMP/tools.json" \
            --checkouts "$RUNNER_TEMP/corpus" --out "$RUNNER_TEMP/run" --only shadowscan \
            --workers 2 --timeout 1500 "${extra[@]}"
      - name: Score and compare with the committed baseline
        working-directory: benchmark-suite
        env:
          REPOS: ${{ inputs.repos }}
        run: |
          extra=()
          if [ -n "$REPOS" ]; then extra=(--repos "$REPOS"); fi
          python -m tools.discovery_benchmark score \
            --corpus benchmarks/shadow-ai-discovery/corpus.json --runs "$RUNNER_TEMP/run/runs.json" \
            --out "$RUNNER_TEMP/run/metrics.json" "${extra[@]}"
          python -m tools.discovery_benchmark report \
            --corpus benchmarks/shadow-ai-discovery/corpus.json --metrics "$RUNNER_TEMP/run/metrics.json" \
            --out "$RUNNER_TEMP/run/REPORT.md"
          results="benchmarks/shadow-ai-discovery/results"
          baseline="${results}/${BASELINE_RUN}/"
          for file in metrics.json runs.json; do
            if [ ! -f "${baseline}${file}" ]; then
              echo "::error::baseline ${baseline}${file} is missing; BASELINE_RUN must name a committed results directory"
              exit 1
            fi
          done
          newest="$(ls -d "${results}"/*/ | sort | tail -1)"
          if [ "$newest" != "$baseline" ]; then
            echo "::notice::baseline stays ${baseline}; ${newest} sorts later and is not used as the baseline"
          fi
          echo "baseline: ${baseline}metrics.json"
          python -m tools.discovery_benchmark compare \
            --corpus benchmarks/shadow-ai-discovery/corpus.json --baseline "${baseline}metrics.json" \
            --baseline-runs "${baseline}runs.json" --current "$RUNNER_TEMP/run/metrics.json" \
            --tools shadowscan --out "$RUNNER_TEMP/run/compare.json" "${extra[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: discovery-benchmark-run
          path: |
            ${{ runner.temp }}/run/runs.json
            ${{ runner.temp }}/run/metrics.json
            ${{ runner.temp }}/run/REPORT.md
            ${{ runner.temp }}/run/compare.json
          if-no-files-found: ignore
