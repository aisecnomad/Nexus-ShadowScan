name: Release candidate evidence

# Builds and attests a review bundle. Uploading it is opt-in and manual: after
# independent review and acceptance (GOVERNANCE.md, release process), the
# maintainer dispatches with `publish` set to testpypi or pypi. The upload job
# then waits for approval in the protected environment of that name, checks out
# nothing and uploads the exact attested wheel and sdist through PyPI trusted
# publishing; no package-index token is stored anywhere. A pypi upload also
# requires the maintainer's tag v<version> on the reviewed commit. After a
# pypi upload, the github-release-assets job attaches the same attested files
# and their Sigstore bundles to a draft GitHub release for that tag. Reviewing
# and publishing the draft stays a maintainer action.
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full main commit SHA reviewed for this candidate
        required: true
        type: string
      ci_run_id:
        description: Successful push CI run ID for that exact main commit
        required: true
        type: string
      codeql_run_id:
        description: Successful push CodeQL run ID for that exact main commit
        required: true
        type: string
      ruleset_readback:
        description: >-
          Administrator readback of merge ruleset 23913372, the output of
          `gh api repos/aisecnomad/Nexus-ShadowScan/rulesets/23913372` run as an administrator
        required: true
        type: string
      publish:
        description: >-
          Upload the attested wheel and sdist: none (evidence only), testpypi
          (rehearsal) or pypi (needs tag v<version> on expected_commit)
        required: true
        default: none
        type: choice
        options:
          - none
          - testpypi
          - pypi

permissions: {}
concurrency:
  group: release-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Initialize the runner-local candidate directory
        run: |
          set -euo pipefail
          candidate_dir="${RUNNER_TEMP:?}/release-candidate"
          printf 'CANDIDATE_DIR=%s\n' "$candidate_dir" >> "$GITHUB_ENV"
      - name: Verify exact commit and successful main CI and CodeQL
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CODEQL_RUN_ID: ${{ inputs.codeql_run_id }}
        run: |
          python - <<'PY'
          import os
          import re
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['EXPECTED_COMMIT']):
              raise SystemExit('expected_commit must be a full lowercase SHA')
          if os.environ['EXPECTED_COMMIT'] != os.environ['GITHUB_SHA']:
              raise SystemExit('main moved; select and review the current main commit')
          for name in ('CI_RUN_ID', 'CODEQL_RUN_ID'):
              if not re.fullmatch(r'[1-9][0-9]*', os.environ[name]):
                  raise SystemExit(f'{name.lower()} must be a positive integer')
          PY
          mkdir -p "$CANDIDATE_DIR"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > "$RUNNER_TEMP/ci-run.json"
          python -m tools.release.evidence verify-ci \
            --input "$RUNNER_TEMP/ci-run.json" --output "$CANDIDATE_DIR/ci-verification.json" \
            --repository "$GITHUB_REPOSITORY" --expected-sha "$EXPECTED_COMMIT" \
            --current-sha "$GITHUB_SHA" --run-id "$CI_RUN_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CODEQL_RUN_ID" > "$RUNNER_TEMP/codeql-run.json"
          python -m tools.release.evidence verify-codeql \
            --input "$RUNNER_TEMP/codeql-run.json" --output "$CANDIDATE_DIR/codeql-verification.json" \
            --repository "$GITHUB_REPOSITORY" --expected-sha "$EXPECTED_COMMIT" \
            --current-sha "$GITHUB_SHA" --run-id "$CODEQL_RUN_ID"
      - name: Verify current enforced merge-rule settings
        env:
          GH_TOKEN: ${{ github.token }}
          RULESET_READBACK: ${{ inputs.ruleset_readback }}
        run: |
          set -euo pipefail
          # Missing bypass_actors cannot prove no bypass, and GitHub withholds
          # it from this token. Keep this identity read-only; never add an
          # administrator credential to the build job. The dispatcher supplies
          # an administrator readback instead, which must match this job's own
          # read in every field the read returns, updated_at included.
          if [ -z "$RULESET_READBACK" ]; then
            echo "ruleset_readback is empty; pass an administrator readback of ruleset 23913372" >&2
            exit 1
          fi
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
          gh api "repos/$GITHUB_REPOSITORY/rulesets/23913372" > "$RUNNER_TEMP/merge-rules.json"
          printf '%s' "$RULESET_READBACK" > "$RUNNER_TEMP/merge-rules-readback.json"
          python -m tools.release.rules verify \
            --input "$RUNNER_TEMP/merge-rules-readback.json" \
            --live "$RUNNER_TEMP/merge-rules.json" \
            --output "$CANDIDATE_DIR/merge-rule-verification.json" \
            --repository "$GITHUB_REPOSITORY" --default-branch "$default_branch" --ruleset-id 23913372
      - name: Install pinned build tools and locked runtime
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            -r requirements-ci.lock -r requirements-build.lock -r requirements.lock
          python -m pip check
      - name: Build the sdist, then the wheel from it, from a clean archive of the verified source
        run: |
          set -euo pipefail
          status="$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
          if [ -n "$status" ]; then
            echo "Release checkout contains modified, untracked, or ignored files:" >&2
            printf '%s\n' "$status" >&2
            exit 1
          fi
          source_dir="$RUNNER_TEMP/release-source"
          mkdir "$source_dir"
          git archive --format=tar HEAD | tar -xf - -C "$source_dir"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          cd "$source_dir"
          # build writes the sdist, then builds the wheel from that sdist with the
          # hash-locked backend; --no-isolation fails if that backend is missing.
          # A file the sdist omits is therefore missing from the wheel as well.
          python -m build --no-isolation --outdir "$CANDIDATE_DIR" .
      - name: Check the wheel and sdist are one matching universal pair
        run: python -m tools.release.distributions --directory "$CANDIDATE_DIR"
      - name: Validate the installed wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/release-wheel"
          "$RUNNER_TEMP/release-wheel/bin/python" -m pip install \
            --require-hashes --only-binary=:all: -r requirements.lock
          "$RUNNER_TEMP/release-wheel/bin/python" -m pip install \
            --no-deps "$CANDIDATE_DIR"/nexusshadowscan-*.whl
          "$RUNNER_TEMP/release-wheel/bin/python" -m pip check
          cp tests/fixtures/sample_repo/services/research-agent/app/agent.py "$RUNNER_TEMP/release-smoke.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release-wheel/bin/python" -c 'from importlib.metadata import distribution; import shadowscan; package = distribution("NexusShadowScan"); assert package.version == shadowscan.__version__; assert any(ep.name == "shadowscan" and ep.value == "shadowscan.cli:main" for ep in package.entry_points)'
          "$RUNNER_TEMP/release-wheel/bin/python" -m shadowscan.signatures.validate
          "$RUNNER_TEMP/release-wheel/bin/shadowscan" --help
          mkdir release-input
          cp release-smoke.py release-input/agent.py
          "$RUNNER_TEMP/release-wheel/bin/shadowscan" code release-input --format json > release-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('release-smoke.json').read_text())
          if report['summary']['complete'] is not True or not report['findings']:
              raise SystemExit('installed wheel smoke scan failed')
          PY
      - name: Audit locked runtime and create its SBOM
        run: |
          pip-audit --require-hashes --strict --progress-spinner off \
            -r requirements.lock -f cyclonedx-json -o "$CANDIDATE_DIR/runtime-sbom.cdx.json"
      - name: Record source identity, dependency pins and file digests
        run: |
          cp requirements.lock requirements-build.lock requirements-ci.lock \
            requirements-ci-constraints.txt "$CANDIDATE_DIR/"
          python -m tools.release.evidence manifest --directory "$CANDIDATE_DIR" \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --workflow-run "$GITHUB_RUN_ID"
          cd "$CANDIDATE_DIR"
          sha256sum --check SHA256SUMS
      - name: Retain candidate for review
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/release-candidate/*
          if-no-files-found: error
          retention-days: 90

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No source checkout or package execution in this job with signing rights.
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: candidate
          digest-mismatch: error
      - name: Verify transferred candidate bytes
        working-directory: candidate
        run: sha256sum --check SHA256SUMS
      - name: Attest candidate provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: candidate/*
          create-storage-record: false
      - name: Attest locked runtime SBOM for the wheel and sdist
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          # Matches exactly the two distributions; no evidence file shares the prefix.
          subject-path: candidate/nexusshadowscan-*
          sbom-path: candidate/runtime-sbom.cdx.json
          create-storage-record: false
      - name: Retain verification bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          mkdir attestations
          # Sigstore bundles. After a pypi upload, the github-release-assets job
          # attaches both to the draft GitHub release, versioned, and the
          # provenance bundle once more as nexusshadowscan-<version>.intoto.jsonl
          # (docs/operations/publishing.md).
          cp "$PROVENANCE_BUNDLE" attestations/provenance.sigstore.json
          cp "$SBOM_BUNDLE" attestations/sbom.sigstore.json
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-attestations-${{ github.sha }}
          path: attestations/*
          if-no-files-found: error
          retention-days: 90

  publication-input:
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This job deliberately has no OIDC token and does not publish. The publish
    # job below consumes this artifact's exact attested bytes; it never checks
    # out source or rebuilds a distribution.
    permissions: {}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: publication-input
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.attest.outputs.artifact_id }}
          path: publication-input/attestations
          digest-mismatch: error
      - name: Verify the exact attested publication input
        working-directory: publication-input
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          wheels=(nexusshadowscan-*.whl)
          sdists=(nexusshadowscan-*.tar.gz)
          # `a && b` does not stop `set -e` when `a` fails; test both in one `if`.
          if [ "${#wheels[@]}" -ne 1 ] || [ ! -f "${wheels[0]}" ]; then
            echo "expected exactly one scanner wheel" >&2
            exit 1
          fi
          if [ "${#sdists[@]}" -ne 1 ] || [ ! -f "${sdists[0]}" ]; then
            echo "expected exactly one scanner sdist" >&2
            exit 1
          fi
          version="${wheels[0]#nexusshadowscan-}"
          version="${version%%-*}"
          if [ "${sdists[0]}" != "nexusshadowscan-$version.tar.gz" ]; then
            echo "sdist ${sdists[0]} does not match wheel version $version" >&2
            exit 1
          fi
          test -s attestations/provenance.sigstore.json
          test -s attestations/sbom.sigstore.json
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-publication-input-${{ github.sha }}
          path: publication-input/**
          if-no-files-found: error
          retention-days: 90

  publication-gate:
    needs: publication-input
    if: inputs.publish != 'none' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reads the release tag through the API. No checkout and no OIDC token.
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.publication-input.outputs.artifact_id }}
          path: publication-input
          digest-mismatch: error
      - name: Require a release version and, for pypi, its tag on the reviewed commit
        working-directory: publication-input
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          wheels=(nexusshadowscan-*.whl)
          sdists=(nexusshadowscan-*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ] || [ ! -f "${wheels[0]}" ]; then
            echo "expected exactly one scanner wheel" >&2
            exit 1
          fi
          version="${wheels[0]#nexusshadowscan-}"
          version="${version%%-*}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "wheel version $version is not a public release version" >&2
            exit 1
          fi
          if [ "${#sdists[@]}" -ne 1 ] || [ "${sdists[0]}" != "nexusshadowscan-$version.tar.gz" ] \
            || [ ! -f "${sdists[0]}" ]; then
            echo "expected exactly one scanner sdist, nexusshadowscan-$version.tar.gz" >&2
            exit 1
          fi
          if [ "$PUBLISH" = pypi ]; then
            # The commits API resolves tags through their fully qualified ref.
            if ! tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/v$version" --jq .sha)"; then
              echo "tag v$version does not exist; tag the reviewed commit $GITHUB_SHA first" >&2
              exit 1
            fi
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "tag v$version points at $tagged, not the reviewed commit $GITHUB_SHA" >&2
              exit 1
            fi
          fi
          echo "Publishing NexusShadowScan $version to $PUBLISH from $GITHUB_SHA"

  publish:
    needs: [publication-input, publication-gate]
    if: inputs.publish != 'none' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that uploads. It waits for approval in the protected
    # environment named by `publish`, whose trusted publisher on the package
    # index accepts this workflow and environment only. The OIDC token is its
    # only permission; it checks out nothing and uploads the attested wheel and
    # sdist.
    environment:
      name: ${{ inputs.publish }}
      url: ${{ inputs.publish == 'testpypi' && 'https://test.pypi.org/p/NexusShadowScan' || 'https://pypi.org/p/NexusShadowScan' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.publication-input.outputs.artifact_id }}
          path: publication-input
          digest-mismatch: error
      - name: Stage only the attested wheel and sdist
        run: |
          set -euo pipefail
          (cd publication-input && sha256sum --check SHA256SUMS)
          wheels=(publication-input/nexusshadowscan-*.whl)
          sdists=(publication-input/nexusshadowscan-*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ] || [ ! -f "${wheels[0]}" ]; then
            echo "expected exactly one scanner wheel" >&2
            exit 1
          fi
          if [ "${#sdists[@]}" -ne 1 ] || [ ! -f "${sdists[0]}" ]; then
            echo "expected exactly one scanner sdist" >&2
            exit 1
          fi
          mkdir dist
          cp -- "${wheels[0]}" "${sdists[0]}" dist/
      - name: Upload with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          repository-url: ${{ inputs.publish == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  github-release-assets:
    needs: [publication-input, publication-gate, publish]
    if: inputs.publish == 'pypi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs only after a successful pypi upload. Attaches the uploaded wheel and
    # sdist, SHA256SUMS and their Sigstore bundles to a draft GitHub release for
    # the tag the gate checked, creating the draft when the tag has no release.
    # It never creates or moves a tag, never publishes or edits a release and
    # never replaces an attached file: the maintainer reviews the draft and
    # publishes it. No checkout, no OIDC token and no third-party action: the
    # runner's GitHub CLI does the work, and writing the release is the job's
    # only permission.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.publication-input.outputs.artifact_id }}
          path: publication-input
          digest-mismatch: error
      - name: Stage the attested files and their bundles as release assets
        working-directory: publication-input
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          wheels=(nexusshadowscan-*.whl)
          sdists=(nexusshadowscan-*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ] || [ ! -f "${wheels[0]}" ]; then
            echo "expected exactly one scanner wheel" >&2
            exit 1
          fi
          if [ "${#sdists[@]}" -ne 1 ] || [ ! -f "${sdists[0]}" ]; then
            echo "expected exactly one scanner sdist" >&2
            exit 1
          fi
          version="${wheels[0]#nexusshadowscan-}"
          version="${version%%-*}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "wheel version $version is not a public release version" >&2
            exit 1
          fi
          if [ "${sdists[0]}" != "nexusshadowscan-$version.tar.gz" ]; then
            echo "sdist ${sdists[0]} does not match wheel version $version" >&2
            exit 1
          fi
          assets="$RUNNER_TEMP/release-assets"
          mkdir "$assets"
          cp -- "${wheels[0]}" "${sdists[0]}" SHA256SUMS "$assets/"
          # One Sigstore bundle per file: the provenance bundle covers every
          # candidate file, SHA256SUMS included; the SBOM bundle covers the
          # wheel and the sdist.
          cp -- attestations/provenance.sigstore.json "$assets/nexusshadowscan-$version.provenance.sigstore.json"
          cp -- attestations/sbom.sigstore.json "$assets/nexusshadowscan-$version.sbom.sigstore.json"
          # The same provenance bundle as JSON Lines, one Sigstore bundle per
          # line, the form `gh attestation download` writes and
          # `gh attestation verify --bundle` reads. Its signed DSSE payload is
          # an in-toto statement with the SLSA v1 provenance predicate. The
          # .intoto.jsonl suffix is the one OpenSSF Scorecard's Signed-Releases
          # check counts as provenance.
          jq --compact-output . attestations/provenance.sigstore.json \
            > "$assets/nexusshadowscan-$version.intoto.jsonl"
          if [ "$(wc -l < "$assets/nexusshadowscan-$version.intoto.jsonl")" -ne 1 ]; then
            echo "the provenance bundle is not one JSON document" >&2
            exit 1
          fi
          printf 'VERSION=%s\nRELEASE_ASSETS=%s\n' "$version" "$assets" >> "$GITHUB_ENV"
      - name: Verify the staged files against the staged bundles, as a downloader would
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RELEASE_ASSETS"
          signer="$GITHUB_REPOSITORY/.github/workflows/release.yml"
          for file in nexusshadowscan-*.whl nexusshadowscan-*.tar.gz SHA256SUMS; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --bundle "nexusshadowscan-$VERSION.intoto.jsonl" \
              --signer-workflow "$signer" --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
          for file in nexusshadowscan-*.whl nexusshadowscan-*.tar.gz; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --bundle "nexusshadowscan-$VERSION.sbom.sigstore.json" \
              --predicate-type https://cyclonedx.org/bom \
              --signer-workflow "$signer" --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
      - name: Attach the verified assets to a draft release for the reviewed tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          # The publication gate read the tag before the approval wait, and the
          # tag ruleset keeps it. Read it again here, so that nothing is
          # attached to a release of another commit.
          if ! tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$tag" --jq .sha)"; then
            echo "tag $tag does not exist" >&2
            exit 1
          fi
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "tag $tag points at $tagged, not the reviewed commit $GITHUB_SHA" >&2
            exit 1
          fi
          state="$RUNNER_TEMP/release-state"
          mkdir "$state"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft \
            > "$state/is-draft" 2> "$state/view-error"; then
            echo "Release $tag exists (draft: $(cat "$state/is-draft")); attaching the files it lacks"
          elif [ "$(cat "$state/view-error")" = "release not found" ]; then
            # A draft is visible only to people with write access; GitHub does
            # not notify watchers or mark it latest until it is published.
            # --verify-tag refuses to create a tag that does not exist.
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "NexusShadowScan $VERSION" \
              --notes "Draft created by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID after the PyPI upload of $GITHUB_SHA. Replace these notes with the $VERSION section of RELEASE_NOTES.md, check the assets, then publish."
          else
            cat "$state/view-error" >&2
            exit 1
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            > "$state/attached"
          mkdir "$state/attached-files"
          uploads=()
          for path in "$RELEASE_ASSETS"/*; do
            name="${path##*/}"
            if ! grep -Fxq -- "$name" "$state/attached"; then
              uploads+=("$path")
              continue
            fi
            # Never replace an attached file. An identical one stays; a
            # different one stops the job before anything is uploaded.
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$name" \
              --dir "$state/attached-files"
            if ! cmp -s -- "$path" "$state/attached-files/$name"; then
              echo "release $tag already has a different $name; review it, delete it by hand and re-run this job" >&2
              exit 1
            fi
            echo "$name is already attached with identical bytes"
          done
          if [ "${#uploads[@]}" -gt 0 ]; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" "${uploads[@]}"
          fi
