name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.lock"
      - "README.md"
      - "CHANGELOG.md"
      - "RELEASE_NOTES.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "GOVERNANCE.md"
      - "CODE_OF_CONDUCT.md"
      - "SUPPORT.md"
      # The API reference pages are generated from these docstrings.
      - "shadowscan/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.lock"
      - "README.md"
      - "CHANGELOG.md"
      - "RELEASE_NOTES.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "GOVERNANCE.md"
      - "CODE_OF_CONDUCT.md"
      - "SUPPORT.md"
      # The API reference pages are generated from these docstrings.
      - "shadowscan/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after GitHub Pages is configured to use GitHub Actions
        type: boolean
        default: false

permissions:
  contents: read

# A newer pull-request update supersedes its site build. A push to main may
# deploy (DOCS_PUBLISH) and a manual run may publish, so neither is cancelled:
# a newer push waits for the running one (GitHub keeps only the newest waiting
# run), and a manual run gets a group of its own. No push can cancel a
# deployment.
concurrency:
  group: docs-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install MkDocs
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-docs.lock
      - name: Build docs
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/

  deploy:
    # Publication is a maintainer decision in two settings: configure GitHub
    # Pages to deploy from GitHub Actions, then either dispatch this workflow
    # with publish=true for a one-off publish, or set the repository variable
    # DOCS_PUBLISH to "true" so every docs push to main republishes the site.
    # Until both are set, pushes only build, so this job cannot fail CI red.
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish) ||
       (github.event_name == 'push' && vars.DOCS_PUBLISH == 'true'))
    needs: build
    # A push run and a manual run are in different workflow groups; this one
    # queues their deployments one at a time and never cancels one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
