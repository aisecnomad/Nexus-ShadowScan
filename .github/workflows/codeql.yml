name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 5 * * 1"  # Monday 05:29 UTC, staggered from CI's 05:17 weekly run
permissions:
  contents: read
# A newer push to the same pull request supersedes its analysis. Runs on main
# and the weekly schedule get a group of their own (the run id), so none is
# cancelled or replaced while queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: python
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
