name: Checkmarx One

# Optional third-party SAST, SCA and KICS scan through Checkmarx One
# (https://github.com/Checkmarx/ast-github-action), pinned by full commit SHA.
# The CLI uploads a zip of the repository to Checkmarx One, so the job runs only
# when the repository variable CX_BASE_URI names the tenant's base URI (for
# example https://ast.checkmarx.net) and the CX_CLIENT_ID, CX_CLIENT_SECRET and
# CX_TENANT secrets exist; until then it is skipped rather than failing every
# run. Pull requests from forks and from Dependabot receive no repository
# secrets and a read-only token, so they are skipped too. Results are uploaded
# to code scanning as SARIF.
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request supersedes its scan, which would otherwise
# ship the source to the tenant again and upload SARIF for a stale merge commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Scan
    if: >-
      vars.CX_BASE_URI != '' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkmarx One scan
        uses: checkmarx/ast-github-action@7006afa846f6d23e3e9d351a001b9d8e59c3fb8c # 2.3.46
        with:
          base_uri: ${{ vars.CX_BASE_URI }}
          cx_client_id: ${{ secrets.CX_CLIENT_ID }}
          cx_client_secret: ${{ secrets.CX_CLIENT_SECRET }}
          cx_tenant: ${{ secrets.CX_TENANT }}
          additional_params: --report-format sarif --output-path .
          # The action defaults to the job's token and the pull request number and
          # hands both to the Checkmarx CLI for pull-request decoration, which the
          # job cannot do (it has no pull-requests scope). Empty values keep the
          # security-events token on GitHub and skip the decoration.
          github_token: ""
          pr_number: ""
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: cx_result.sarif
