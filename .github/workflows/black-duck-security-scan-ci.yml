name: Black Duck

# Optional third-party SAST/SCA through Black Duck SCA, Coverity, Polaris or
# Software Risk Manager (https://github.com/blackduck-inc/black-duck-security-scan),
# pinned by full commit SHA. The job runs only when at least one of those
# services is configured as a repository variable (BLACKDUCKSCA_URL,
# COVERITY_URL, POLARIS_SERVER_URL or SRM_URL) with its secret; without one the
# action has nothing to scan against and fails. Pull requests from forks and
# from Dependabot receive no repository secrets, so the job skips them. The
# action gets no GitHub token, so it neither comments on pull requests nor
# uploads SARIF; either would need a write scope that
# tests/test_repository_policy.py must allow for this job explicitly.
# The wrapper action is pinned by commit SHA, and the Bridge CLI it downloads
# at run time must be pinned too: the job also requires the repository
# variable BRIDGECLI_DOWNLOAD_VERSION, set to a reviewed Bridge CLI version,
# and passes it as `bridgecli_download_version`. Configuring a service
# without that pin keeps the job skipped, so an unreviewed current CLI is
# never downloaded.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "25 6 * * 3"  # Wednesday 06:25 UTC

permissions:
  contents: read

# A newer push to the same pull request supersedes its scan, which would otherwise
# run the vendor's CLI with every scanner secret again for a stale merge commit.
# Runs on main and the schedule get a group of their own (the run id).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Scan
    if: >-
      (vars.BLACKDUCKSCA_URL != '' || vars.COVERITY_URL != '' ||
       vars.POLARIS_SERVER_URL != '' || vars.SRM_URL != '') &&
      vars.BRIDGECLI_DOWNLOAD_VERSION != '' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Black Duck security scan
        uses: blackduck-inc/black-duck-security-scan@152247222aa9cd38124acd5c0cf60f4db71adc3f # v2.11.0
        with:
          bridgecli_download_version: ${{ vars.BRIDGECLI_DOWNLOAD_VERSION }}
          blackducksca_url: ${{ vars.BLACKDUCKSCA_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCKSCA_TOKEN }}
          coverity_url: ${{ vars.COVERITY_URL }}
          coverity_user: ${{ secrets.COVERITY_USER }}
          coverity_passphrase: ${{ secrets.COVERITY_PASSPHRASE }}
          polaris_server_url: ${{ vars.POLARIS_SERVER_URL }}
          polaris_access_token: ${{ secrets.POLARIS_ACCESS_TOKEN }}
          polaris_assessment_types: "SCA,SAST"
          srm_url: ${{ vars.SRM_URL }}
          srm_apikey: ${{ secrets.SRM_API_KEY }}
          srm_assessment_types: "SCA,SAST"
