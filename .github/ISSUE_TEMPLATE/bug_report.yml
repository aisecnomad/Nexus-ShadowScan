name: Bug report
description: Report a scan failure, incorrect finding, or unexpected behavior.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not include credentials, JWTs, private exports, or exploit details.**
        Use a [private security advisory](https://github.com/aisecnomad/Nexus-ShadowScan/security/advisories/new) for credential leaks, redaction failures, or anything that could expose sensitive data.

  - type: input
    id: version
    attributes:
      label: Release version and artifact identity, or full commit SHA
      description: For a wheel from PyPI, the version (`shadowscan --version`) and the wheel's SHA-256 or attestation. For a source or Git install, the full 40-character commit SHA (`git rev-parse HEAD`); the version string alone is the same for every commit between releases and cannot identify a revision.
      placeholder: "0.1.4, nexusshadowscan-0.1.4-py3-none-any.whl sha256:…  or  0123456789abcdef0123456789abcdef01234567"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Which surface or component is affected?
      options:
        - Code (filesystem / GitHub / GitLab)
        - Identity (Okta / Entra / Google Workspace / Auth0 / JWT)
        - Gateway (logs / OpenTelemetry spans)
        - Low-code (Power Platform / Salesforce / ServiceNow / n8n / Make / Zapier / Workato)
        - SaaS (Slack / Teams / GitHub Apps / Atlassian / Notion / Zoom / generic)
        - Cloud (AWS / GCP / Azure / OCI / Kubernetes / OpenShift)
        - Endpoint (developer workstations / host and runtime inventories)
        - Network (logs)
        - Runtime (running processes)
        - Core engine / CLI / reporters
        - Signatures
        - Other
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Collection mode
      options:
        - Live (API credentials)
        - Offline (JSON / CSV / log export)
        - Both
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. Include the CLI command you ran and any relevant output.
      placeholder: |
        I ran `shadowscan run identity.entra --set tenant_id=...` and got...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration (sanitized)
      description: |
        Paste the relevant section of your `shadowscan.yaml` with all secrets removed.
        Use `${REDACTED}` in place of real tokens.
      render: yaml

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, container or CI runner details.
      placeholder: |
        Python 3.12.4, Ubuntu 24.04, running in GitHub Actions
    validations:
      required: true

  - type: dropdown
    id: scan-exit
    attributes:
      label: Scan exit code
      options:
        - "0 (completed, passed)"
        - "1 (no scan result: invalid option, value, path or configuration, unknown connector, or a setup or output error)"
        - "2 (completed; --fail-on, --fail-on-new or --fail-on-drift triggered)"
        - "3 (incomplete scan)"
        - Not applicable
