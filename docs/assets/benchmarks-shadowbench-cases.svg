  <desc id="desc">Recall per tool in the ShadowBench nine-surface cases run of 2026-10-11, an author-written synthetic corpus: shadowscan (9/9 surfaces) estate 84%, in scope 88%; agentdiscover (2/9 surfaces) estate 4%, in scope 20%; ai-infra-guard (1/9 surfaces) estate 4%, in scope 81%; vet (2/9 surfaces) estate 2%, in scope 13%; agentmesh-discovery (3/9 surfaces) estate 2%, in scope 8%; fleet-ai-tools (2/9 surfaces) estate 2%, in scope 19%; snyk-agent-scan (1/9 surfaces) estate 1%, in scope 29%; cisco-mcp-scanner (1/9 surfaces) estate 0%, in scope 4%; numbat (1/9 surfaces) estate 0%, in scope 4%.</desc>
