  <text x="24" y="34" font-size="22" font-weight="700" fill="#17212b">ShadowBench nine-surface cases: recall by tool (run 2026-10-11)</text>
  <text x="24" y="60" font-size="14" fill="#4a5661">Author-written synthetic corpus. ShadowScan's maintainer wrote the corpus, rubrics, scorer and every tool's adapter.</text>
  <text x="24" y="80" font-size="14" fill="#4a5661">Estate recall charges a tool for surfaces it does not cover: compare tools on in-scope recall. Not field accuracy;</text>
  <text x="24" y="100" font-size="14" fill="#4a5661">not a verdict on any product. Source: benchmarks/shadowbench/cases.</text>
