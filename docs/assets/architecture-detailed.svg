  <desc id="desc">The built-in connectors of each surface: code: code.filesystem, code.github, code.gitlab; identity: identity.auth0, identity.entra, identity.google-workspace, identity.jwt, identity.okta; gateway: gateway.logs, gateway.otel; lowcode: lowcode.make, lowcode.n8n, lowcode.power-platform, lowcode.salesforce, lowcode.servicenow, lowcode.workato, lowcode.zapier; saas: saas.atlassian, saas.generic, saas.github-apps, saas.microsoft-teams, saas.notion, saas.slack, saas.zoom; cloud: cloud.aws, cloud.azure, cloud.gcp, cloud.kubernetes, cloud.oci, cloud.openshift; endpoint: endpoint.ebpf, endpoint.host, endpoint.inventory, endpoint.mcp, endpoint.models, endpoint.ollama; network: network.logs; runtime: runtime.processes.</desc>
