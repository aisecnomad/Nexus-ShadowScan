  <text x="24" y="34" font-size="22" font-weight="700" fill="#17212b">Built-in connectors by surface</text>
  <text x="24" y="58" font-size="14" fill="#4a5661">Each connector reads one provider, export or host source and emits findings with evidence;</text>
  <text x="24" y="78" font-size="14" fill="#4a5661">third-party connectors join only through the options.plugins allowlist and cannot replace these names.</text>
