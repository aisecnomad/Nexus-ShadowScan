  <text x="908" y="328" font-size="13" fill="#17212b">managed AI, IAM, workload exports</text>
  <rect x="336" y="344" width="266" height="44" rx="8" fill="#e3eef9" stroke="#9db9d6" stroke-width="1.5"/>
  <text x="348" y="362" font-size="13" font-weight="700" fill="#17212b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">endpoint</text>
