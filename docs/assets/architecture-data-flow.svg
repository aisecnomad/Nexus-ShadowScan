<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Data flow of one Nexus ShadowScan scan</title>
  <desc id="desc">Trusted operator inputs (signature packs, configuration, the agent registry and mapping catalogs) and untrusted scan targets (provider APIs, offline exports, repository checkouts, hosts and processes) feed the connectors of code, identity, gateways, low-code, SaaS, cloud, endpoints, network logs and running processes; the engine merges, correlates, reconciles, assesses and scores the findings; reporters and the JSON report commands publish them.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f7a8c"/></marker></defs>
  <rect x="0" y="0" width="1200" height="820" rx="0" fill="#fbfaf7" stroke="none" stroke-width="1.5"/>
  <text x="24" y="34" font-size="22" font-weight="700" fill="#17212b">One scan, end to end: evidence in, scored and registry-reconciled findings out</text>
  <text x="24" y="58" font-size="14" fill="#4a5661">Tinted: trusted operator inputs · dashed: untrusted scan targets · arrows: data flow</text>
