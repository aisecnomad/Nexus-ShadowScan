  <text x="348" y="131" font-size="13" font-weight="700" fill="#17212b">Provider APIs</text>
  <text x="348" y="151" font-size="13" fill="#17212b">HTTPS, read-only (collect)</text>
  <rect x="546" y="110" width="196" height="56" rx="8" fill="#ffffff" stroke="#c4ccd4" stroke-width="1.5"/>
  <text x="558" y="131" font-size="13" font-weight="700" fill="#17212b">Offline exports</text>
  <text x="558" y="151" font-size="13" fill="#17212b">JSONL, CSV, logs (input)</text>
  <rect x="756" y="110" width="196" height="56" rx="8" fill="#ffffff" stroke="#c4ccd4" stroke-width="1.5"/>
  <text x="768" y="131" font-size="13" font-weight="700" fill="#17212b">Repository checkouts</text>
  <text x="768" y="151" font-size="13" fill="#17212b">local or cloned, never run</text>
  <rect x="966" y="110" width="196" height="56" rx="8" fill="#ffffff" stroke="#c4ccd4" stroke-width="1.5"/>
  <text x="978" y="131" font-size="13" font-weight="700" fill="#17212b">Hosts and processes</text>
