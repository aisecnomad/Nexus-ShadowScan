  <text x="40" y="226" font-size="15" font-weight="700" fill="#17212b">Trusted operator inputs</text>
  <rect x="40" y="240" width="240" height="92" rx="8" fill="#ffffff" stroke="#9db9d6" stroke-width="1.5"/>
  <text x="52" y="261" font-size="13" font-weight="700" fill="#17212b">Signature packs</text>
  <text x="52" y="281" font-size="13" fill="#17212b">YAML: frameworks, providers,</text>
  <text x="52" y="299" font-size="13" fill="#17212b">protocols, agents, platforms,</text>
  <text x="52" y="317" font-size="13" fill="#17212b">identity apps, permissions</text>
  <rect x="40" y="348" width="240" height="74" rx="8" fill="#ffffff" stroke="#9db9d6" stroke-width="1.5"/>
  <text x="52" y="369" font-size="13" font-weight="700" fill="#17212b">Configuration</text>
  <text x="52" y="389" font-size="13" fill="#17212b">shadowscan.yaml, credentials</text>
  <text x="52" y="407" font-size="13" fill="#17212b">from the environment, risk policy</text>
