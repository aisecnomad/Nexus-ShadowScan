# Baseline egress policies for ShadowScan pods
# (docs/operations/operational-controls.md). Apply both documents.
#
# The first denies all egress to every pod labelled
# app.kubernetes.io/name: shadowscan. NetworkPolicies are additive, so a pod
# that lacks or misspells the mode label stays denied instead of falling
# outside every policy. The second widens egress to cluster DNS only for pods
# that also carry shadowscan-mode: live; label live-collection Jobs that way
# (the Job in k8s-job.yaml is offline and needs no egress). Live API access
# needs an additional, deployment-specific allow rule before a scan can succeed.
#
# A standard NetworkPolicy matches addresses, not DNS names, so it cannot
# express "only graph.microsoft.com". This example permits cluster DNS, but no
# HTTPS destination by default. Add only the addresses and ports needed to
# reach an approved transparent egress gateway or use a CNI with FQDN policies.
# Enforce the per-connector host allowlist in a layer that sees names.
# ShadowScan's HTTP client ignores proxy environment variables and rejects an
# explicit proxy, so HTTPS_PROXY is not an option. DNS itself can carry data;
# restrict and monitor DNS separately.
#
# Do not use a broad 0.0.0.0/0 or ::/0 HTTPS rule without excluding the actual
# pod, service, node, VPC and other internal routed CIDRs in BOTH address
# families. Internal networks can use public IPv4 or global-unicast IPv6
# space, not just RFC1918 and unique-local ranges. Account for cloud metadata,
# Azure's wire server, IPv4-mapped IPv6, NAT64 and any local translation
# prefixes. A narrow allowlist of approved gateway addresses is preferable.
# IP-based rules alone cannot enforce an API host allowlist, and addresses and
# DNS answers can change. NetworkPolicies are additive: any other policy that
# selects these pods may widen the allowed destinations.
#
# These policies block NodeLocal DNSCache (169.254.20.10), the GKE metadata
# server that Workload Identity uses and the EKS Pod Identity agent
# (169.254.170.23). A live scan that needs one of them fails and reports the
# scan incomplete (exit 3). Allow only the one address and port you need, and
# remember that the cloud SDKs, unlike ShadowScan's HTTP client, do not refuse
# metadata addresses themselves.
#
# Validate the deployed policies with the actual CNI and cluster routing,
# including service DNAT, IPv6, NodeLocal DNS and host-network behavior.
# Enforced only by a CNI that supports NetworkPolicy. Confirm no other selecting
# policy grants broader access before relying on these controls.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shadowscan-default-deny-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shadowscan
  policyTypes: [Egress]
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shadowscan-live-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shadowscan
      shadowscan-mode: live
  policyTypes: [Egress]
  egress:
    # Cluster DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Add an explicit destination and port for your approved egress path here.
    # Do not apply a placeholder address: determine the actual destination and
    # validate it against the cluster's complete internal and translated ranges.
