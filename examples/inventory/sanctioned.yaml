# `agents` contains sanctioned findings; names alone only suggest matches.
# `not_ai` suppresses name-only findings by exact operator-declared identity.
agents:
  - id: sanctioned-copilot
    name: GitHub Copilot
    owner: platform
    autonomy_level: 2
    frameworks: []
    providers: []
not_ai:
  - id: reporting-dashboard
    client_id: reporting-dashboard-client
    app_id: reporting-dashboard-app
    name: Finance Reporting Dashboard
    resource_ids:
      - google-marketplace:app:reporting-dashboard
