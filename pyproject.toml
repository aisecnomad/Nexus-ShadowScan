[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "NexusShadowScan"
version = "0.1.2"
description = "Nexus ShadowScan: discover shadow AI agents across code, identity providers, LLM gateways, low-code platforms, SaaS, cloud accounts, endpoints, network logs, and running processes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.14"
authors = [{ name = "Nexus ShadowScan contributors" }]
keywords = ["ai-agents", "shadow-ai", "security", "discovery", "langchain", "mcp", "agentic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
# Each range caps the next major so a surprise upstream major bump cannot
# resolve into a user's sdist install. requirements.lock pins the exact
# reviewed version for deployments and CI; the caps here protect the
# unlocked `pip install NexusShadowScan` path from untested majors. regex is
# calendar-versioned (YYYY.M.D) and has no major to cap: a year cap would
# shut out every later release, security fixes included.
dependencies = [
  "click>=8.5.0,<9",
  "rich>=15.0.0,<16",
  "PyYAML>=6.0.3,<7",
  "requests>=2.34.2,<3",
  "urllib3>=2.8.0,<3",
  "PyJWT[crypto]>=2.14.0,<3",
  "regex>=2026.9.10",
]

[project.optional-dependencies]
aws = ["boto3>=1.43.99,<2"]
gcp = ["google-auth>=2.58.0,<3"]
azure = ["azure-identity>=1.25.3,<2"]
oci = ["oci>=2.187.0,<3"]
cloud = ["boto3>=1.43.99,<2", "google-auth>=2.58.0,<3", "azure-identity>=1.25.3,<2", "oci>=2.187.0,<3"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-xdist>=3.5", "hypothesis>=6.169.0", "ruff>=0.16.8", "mypy>=1.10", "types-PyYAML", "types-requests", "responses>=0.25", "pip-audit>=2.9", "jsonschema>=4.18", "pre-commit>=4.6.2", "setuptools>=84.0.0", "wheel>=0.48.0"]
docs = ["mkdocs-material>=9.7.7", "mkdocstrings[python]>=1.0.7"]
all = ["NexusShadowScan[cloud,dev,docs]"]

[project.scripts]
shadowscan = "shadowscan.cli:main"

[project.entry-points."shadowscan.connectors"]
# Third-party connectors can register here: name = "package.module:ConnectorClass"

[project.urls]
Homepage = "https://github.com/aisecnomad/Nexus-ShadowScan"
Documentation = "https://github.com/aisecnomad/Nexus-ShadowScan/tree/main/docs"
Repository = "https://github.com/aisecnomad/Nexus-ShadowScan"
Changelog = "https://github.com/aisecnomad/Nexus-ShadowScan/blob/main/CHANGELOG.md"
"Release notes" = "https://github.com/aisecnomad/Nexus-ShadowScan/blob/main/RELEASE_NOTES.md"
Security = "https://github.com/aisecnomad/Nexus-ShadowScan/blob/main/SECURITY.md"
Issues = "https://github.com/aisecnomad/Nexus-ShadowScan/issues"

[tool.setuptools.packages.find]
include = ["shadowscan*"]

[tool.setuptools.package-data]
shadowscan = [
  "signatures/data/**/*.yaml",
  "signatures/data/**/*.yml",
  "mappings/data/**/*.yaml",
  "py.typed",
]

[tool.ruff]
line-length = 110
target-version = "py311"
# archive/ holds retained review artifacts; pre-commit's ruff hooks pass
# --force-exclude, so this keeps them from being rewritten.
exclude = [
  "tests/fixtures",
  "examples",
  "archive",
  # ShadowBench estate artifacts: authored sample repositories and exports
  # that discovery tools are scored on, not project code.
  "benchmarks/shadowbench/estate/artifacts",
]

[tool.ruff.lint]
# BLE: a broad `except` that does not re-raise is flagged; an intentional one
# carries `# noqa: BLE001 - <reason>` (tests/test_repository_consistency.py
# requires the reason). RUF100: a `noqa` that suppresses nothing is flagged.
# S (flake8-bandit): a security scanner should be held to the rule set it
# would apply to anything it scans. Every suppression in the package carries
# a reason, so each is a reviewed decision rather than an unexamined gap, and
# a new occurrence fails CI. S101 is off because `assert` is how the tests
# assert; the rest are scoped to the shipped package below, since test and
# tooling code legitimately holds fake credentials, runs the CLI as a
# subprocess, writes to temp paths and uses `random` for fixture data.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "BLE", "S", "RUF100"]
# Deliberate ignores, not debt. SIM102/SIM103/SIM105/SIM108 and C408 only
# propose equivalent rewrites (collapsed guards, `return cond`,
# contextlib.suppress, ternaries, dict literals); the longer forms stay.
# UP042 is not behaviour-preserving: StrEnum changes what `str()` and
# f-strings yield for the models.py enums, which serialise via `.value`.
ignore = ["SIM108", "SIM102", "SIM103", "C408", "SIM105", "UP042", "S101"]

[tool.ruff.lint.per-file-ignores]
# Tests hold long literal fixtures (source snippets, tokens, JSON records).
# The bandit rules target shipped code: a test's hard-coded token is the
# point of the test, and the harnesses run the CLI as a subprocess by design.
"tests/**" = ["E501", "S"]
"tools/**" = ["S"]
"benchmarks/**" = ["S"]
# Benchmark case templates embed source files from other languages verbatim.
"tools/benchmark/*_cases.py" = ["E501"]
"benchmarks/*/corpus.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Unknown markers and ini keys fail collection: a misspelt opt-out marker such
# as production_budgets would otherwise be ignored without a warning. No `-q`
# here: every documented command already passes one, and a second hides the
# pass/skip summary line.
addopts = "--strict-markers --strict-config"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
# ShadowBench estate artifacts are inputs under test, not project code.
exclude = ["benchmarks/shadowbench/estate/artifacts/"]
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
check_untyped_defs = true
# First-party imports and stubbed libraries (types-PyYAML, types-requests from
# the dev extra) are checked. The override below covers regex, boto3/botocore
# and oci, which ship neither stubs nor a py.typed marker, and the optional
# cloud SDKs google-auth and azure-identity, which are typed and are checked
# wherever they are installed (CI installs requirements.lock) but which
# `make install-dev` leaves out, so `make typecheck` must pass without them
# (tests/test_optional_sdk_typecheck.py).
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "regex",
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "oci",
    "oci.*",
    "google",
    "google.auth",
    "google.auth.*",
    "azure.identity",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["shadowscan"]
omit = ["shadowscan/signatures/data/*"]
# Both floors (fail_under below and tools/coverage_gate.py) count branches as
# well as statements: a line that ran says nothing about its untaken branch.
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
