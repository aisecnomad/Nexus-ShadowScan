# Reviewed facts about the built-in connectors that their code does not state.
#
# tools/connector_inventory.py derives the rest of docs/connectors/inventory.json
# from the connector classes, a static read of their code and the guides, and
# validates every entry here against them (make connector-inventory; the test is
# tests/test_connector_inventory.py). Every registered connector needs an entry
# and no entry may name a connector that is not registered.
#
# Per connector:
#   least_privilege: the row of the "Least privilege" table in docs/connectors.md
#     that states its minimum permissions. The inventory quotes that row, so the
#     permission model is reviewed once, in the guide.
#   permissions: for a connector with no row, one sentence on what it needs.
#     An offline-only connector without a row needs neither: it reads an export.
#   egress: where a live connector connects, one destination per item:
#     api.example.com          a fixed host; it must be an https:// literal in the code
#     "*-suffix.example.com"   hosts built at run time; the suffix must occur in the code
#     "<key>"                  the host in this configuration key
#     "sdk:<module>"           endpoints the named SDK chooses (it must be imported)
#     "discovered: <text>"     a destination read from a provider response, and how it is bounded
#   not_egress: https:// hosts the code names but never connects to, with the reason.
#     Every https:// host in a connector module that imports a network client must
#     be listed under egress or here, so a new destination fails the check until
#     someone reviews it.

# Third-party top-level imports, by what installs them. A connector importing a
# module listed in neither fails the check.
core_imports:  # pyproject.toml [project] dependencies
  click: click
  jwt: PyJWT
  regex: regex
  requests: requests
  rich: rich
  urllib3: urllib3
  yaml: PyYAML
sdk_imports:  # module: the pyproject.toml extra that installs it
  azure: azure
  boto3: aws
  botocore: aws  # installed with boto3
  google: gcp
  oci: oci

connectors:
  cloud.aws:
    least_privilege: AWS
    egress: ["sdk:boto3"]
  cloud.azure:
    least_privilege: Azure
    egress:
      - management.azure.com
      - "sdk:azure"
      - "discovered: Foundry project endpoints from Azure Resource Manager, checked by the URL destination policy"
    not_egress:
      ai.azure.com: token audience (https://ai.azure.com/.default) for the Foundry token
  cloud.gcp:
    least_privilege: GCP
    egress:
      - agentregistry.googleapis.com
      - apikeys.googleapis.com
      - cloudfunctions.googleapis.com
      - cloudresourcemanager.googleapis.com
      - iam.googleapis.com
      - logging.googleapis.com
      - run.googleapis.com
      - secretmanager.googleapis.com
      - serviceusage.googleapis.com
      - "*-aiplatform.googleapis.com"
      - "*dialogflow.googleapis.com"
      - "*discoveryengine.googleapis.com"
      - "sdk:google"
    not_egress:
      www.googleapis.com: OAuth scope identifiers (https://www.googleapis.com/auth/...)
  cloud.kubernetes: {}
  cloud.oci:
    least_privilege: OCI
    egress: ["sdk:oci"]
  cloud.openshift: {}
  code.filesystem:
    permissions: >-
      Read access to the configured paths as the account running the scan; no
      provider credentials. diff_base runs the local git binary on the scanned
      repository.
  code.github:
    least_privilege: GitHub
    egress: ["<api_url>", api.github.com, github.com]
  code.gitlab:
    least_privilege: GitLab
    egress: ["<api_url>", gitlab.com]
  endpoint.ebpf: {}
  endpoint.host: {}
  endpoint.inventory:
    least_privilege: Endpoint
  endpoint.mcp:
    permissions: >-
      No provider credentials. The opt-in probe fetches the A2A Agent Cards in
      agent_card_urls, and the keys at agent_card_jwks_url, anonymously over
      HTTPS; a private CA comes from ca_bundle.
    egress: ["<agent_card_urls>", "<agent_card_jwks_url>"]
  endpoint.models: {}
  endpoint.ollama: {}
  gateway.logs: {}
  gateway.otel: {}
  identity.auth0:
    least_privilege: Auth0
    egress: ["<domain>"]
  identity.entra:
    least_privilege: Entra / Teams / Power Platform
    egress: [graph.microsoft.com, login.microsoftonline.com]
    not_egress:
      entra.microsoft.com: admin-portal links written into finding evidence
  identity.google-workspace:
    least_privilege: Google Workspace
    egress: [admin.googleapis.com, oauth2.googleapis.com]
    not_egress:
      www.googleapis.com: OAuth scope identifiers (https://www.googleapis.com/auth/...)
  identity.jwt:
    permissions: >-
      No provider credentials. Tokens come from the configuration or input; an
      optional jwks_url is fetched anonymously over HTTPS to verify signatures.
    egress: ["<jwks_url>"]
  identity.okta:
    least_privilege: Okta
    egress: ["<org_url>"]
  lowcode.make:
    least_privilege: Make
    egress: ["<api_url>"]
  lowcode.n8n:
    least_privilege: n8n
    egress: ["<api_url>"]
  lowcode.power-platform:
    least_privilege: Entra / Teams / Power Platform
    egress:
      - api.bap.microsoft.com
      - api.flow.microsoft.com
      - api.powerplatform.com
      - login.microsoftonline.com
      - "discovered: Dataverse environment origins from the admin API, limited to Dynamics CRM hosts"
    not_egress:
      service.flow.microsoft.com: token audience (https://service.flow.microsoft.com/.default)
      service.powerapps.com: token audience (https://service.powerapps.com/.default)
  lowcode.salesforce:
    least_privilege: Salesforce
    egress: ["<instance_url>"]
  lowcode.servicenow:
    least_privilege: ServiceNow
    egress: ["<instance>"]
  lowcode.workato:
    least_privilege: Workato
    egress: ["<api_url>", www.workato.com]
  lowcode.zapier:
    least_privilege: Zapier
    egress: [api.zapier.com]
  network.logs:
    least_privilege: Network
  runtime.processes:
    least_privilege: Runtime
  saas.atlassian:
    least_privilege: Atlassian
    egress: ["<site>"]
  saas.generic: {}
  saas.github-apps:
    least_privilege: GitHub Apps
    egress: ["<api_url>", api.github.com]
  saas.microsoft-teams:
    least_privilege: Entra / Teams / Power Platform
    egress: [graph.microsoft.com, login.microsoftonline.com]
  saas.notion:
    least_privilege: Notion
    egress: [api.notion.com]
  saas.slack:
    least_privilege: Slack
    egress: [slack.com]
  saas.zoom:
    least_privilege: Zoom
    egress: [api.zoom.us, zoom.us]
