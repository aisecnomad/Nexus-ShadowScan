score_quotes:
  description: >
    Score every quote in {quotes} against the rate card. Return one line per
    quote with lane, rate, delta to the trailing median and a verdict of
    accept, counter or reject.
  expected_output: A scored quote table, one quote per line.

plan_lanes:
  description: >
    From the scored quotes, assign carriers to next week's lanes so that no
    lane exceeds its weekly budget. Note every lane left uncovered.
  expected_output: A lane assignment list plus an uncovered-lane note.
