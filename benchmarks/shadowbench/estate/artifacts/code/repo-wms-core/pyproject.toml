[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wms-core"
version = "4.2.0"
description = "Warehouse management core service for Adatum Logistics"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg2-binary>=2.9",
  "gunicorn>=22",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/wms_core"]
