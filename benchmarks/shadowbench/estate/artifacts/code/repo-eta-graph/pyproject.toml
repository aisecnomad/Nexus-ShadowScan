[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eta-graph"
version = "1.4.0"
description = "ETA replanning graph for Adatum Logistics linehaul"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2,<0.4",
  "anthropic>=0.39",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/eta_graph"]
