[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freight-crew"
version = "0.3.1"
description = "Carrier quote triage crew for the Adatum Logistics freight desk"
requires-python = ">=3.11"
dependencies = [
  "crewai>=0.80,<1",
  "crewai-tools>=0.17",
  "langchain-openai>=0.2",
  "pydantic>=2.7",
  "pyyaml>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/freight_crew"]
