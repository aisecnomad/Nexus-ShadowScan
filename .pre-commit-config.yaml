# Pre-commit hooks for ShadowScan development.
# Install the hash-locked toolchain and hooks: make install-hooks (or
# pre-commit install after make install)
# Run manually: pre-commit run --all-files
exclude: ^benchmark-suite/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      # Fixtures reproduce foreign files byte for byte, the retained licence
      # texts are digest-bound to their upstream copies, archive/ holds
      # retained review artifacts, and ShadowBench's corpora, artifacts and
      # results are frozen by digest or written by its scorers; never rewrite
      # them.
      - id: trailing-whitespace
        # Two trailing spaces are a Markdown line break (.editorconfig keeps them).
        args: [--markdown-linebreak-ext=md]
        exclude: ^(archive/|tests/fixtures/|tools/evaluation/independent_licenses/|benchmarks/shadowbench/[^/]+/(artifacts/|results/|corpus\.json$|FREEZE\.json$))
      - id: end-of-file-fixer
        exclude: ^(archive/|tests/fixtures/|tools/evaluation/independent_licenses/|benchmarks/shadowbench/[^/]+/(artifacts/|results/|corpus\.json$|FREEZE\.json$))
      # mkdocs.yml uses Material's `!!python/name:` tags, which the safe loader
      # rejects; `mkdocs build --strict` in CI validates that file instead.
      # Signature packs are parsed by the signature-validate hook below (and by
      # `python -m shadowscan.signatures.validate` in CI) with the stricter
      # unique-key bounded loader, so they are not checked twice here.
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^(shadowscan/signatures/data/|mkdocs\.yml$)
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
        # The redaction rules and their tests name PEM, PGP and PuTTY key markers
        # around synthetic placeholders; none of these files holds key material.
        exclude: |
          (?x)^(
            shadowscan/utils/redaction_formats\.py|
            tests/unit/test_(redaction_security|redaction_cli_and_formats|redaction_pass_order|redaction_performance|regex_linearity)\.py|
            tests/unit/test_benchmark_realworld_review2\.py
          )$
      - id: no-commit-to-branch
        args: [--branch=main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # v0.17.1
    hooks:
      # CI lints and formats Python only; the format hook would also rewrite
      # Python blocks in Markdown.
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        types_or: [python, pyi]

  # Keep the ruff and mypy version comments equal to the pins in
  # requirements-ci-constraints.txt so the hooks run the same versions as CI.
  # The immutable revs are the commits to which those reviewed tags resolve.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 2834ec6639549dd6796205c8f011dedcd587288b # v2.4.0
    hooks:
      - id: mypy
        files: ^(shadowscan|tools)/
        # The estate track's sample repositories are inputs under test, not
        # project code. pre-commit passes files explicitly, which mypy's own
        # `exclude` setting does not filter, so the hook excludes them too.
        exclude: ^benchmarks/shadowbench/estate/artifacts/
        # The hook runs in its own environment. click, PyJWT, rich and urllib3
        # ship their own types; without them those imports are Any, so a wrong
        # call passes the hook but fails CI and `type: ignore` comments read as
        # unused. Keep these pins equal to requirements.lock. The hook's default
        # args add --ignore-missing-imports, which CI does not use: the pyproject
        # override already names the packages that may be imported untyped.
        additional_dependencies:
          - click==8.5.0
          - PyJWT==2.15.1
          - rich==15.0.0
          - urllib3==2.8.0
          - types-PyYAML==6.0.12.20260906
          - types-requests==2.33.0.20261006
        args: []

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # v2.4.3
    hooks:
      - id: codespell
        # Skips and the accepted-word list live in pyproject.toml
        # ([tool.codespell]); the exclude mirrors the skips because pre-commit
        # passes files explicitly.
        exclude: ^(archive/|benchmark-suite/|benchmarks/|docs/history/|tests/fixtures/|tools/evaluation/|.*\.(lock|json|svg|webp|png)$)

  - repo: local
    hooks:
      - id: signature-validate
        name: Validate signature schemas
        entry: python -m shadowscan.signatures.validate
        language: system
        pass_filenames: false
        files: ^shadowscan/signatures/

      - id: mapping-validate
        name: Validate threat and control mapping catalogs
        entry: python -m shadowscan.mappings.validate
        language: system
        pass_filenames: false
        # Rules are checked against risk tags, capabilities and finding kinds.
        files: ^shadowscan/(mappings/|risk\.py$|models\.py$|signatures/schema\.py$)

      - id: no-hardcoded-secrets
        name: Check for hardcoded secret patterns
        entry: python tools/check_secrets.py
        language: system
        # Every text file, including tests, signatures and evaluation corpora.
        # Only exact reviewed path/family/digest entries in the manifest are
        # approved. The script also rejects stale approvals on partial runs.
        types: [text]
