version = 1
revision = 2
requires-python = ">=3.11"

[manifest]
members = [
    "example",
    "member",
]

[[package]]
name = "example"
source = { virtual = "." }
dependencies = [
    { name = "member" },
]

[[package]]
name = "member"
source = { editable = "packages/member" }
dependencies = [
    { name = "crewai" },
]

[[package]]
name = "crewai"
version = "0.80.0"
source = { registry = "https://pypi.org/simple" }
