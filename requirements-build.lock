    --hash=sha256:94800765601e9171bf5d58d066e640662842bcedcbab982b2c90787a2c987322
# wheel 0.48.0 declares packaging>=24.0; pin it here so --require-hashes can
# resolve the backend's own dependency without consulting the live index.
packaging==26.3 \
    --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c \
