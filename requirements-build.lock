# Build backend lock for the shadowscan wheel. It carries the exact
# [build-system] requires from pyproject.toml with the SHA-256 hash of every
# artifact PyPI publishes for those releases (wheel and sdist), captured from
# https://pypi.org/pypi/<name>/<version>/json on 2026-09-24.
#
# Install with --require-hashes --only-binary=:all: before building the package
# with --no-build-isolation, so pip never resolves a build backend from the live
# index on a version pin alone. The Dockerfile, CI and docs/production.md share
# this file. Keep the versions identical to pyproject.toml's [build-system]
# table; CI fails when they drift. To refresh: bump pyproject.toml, then copy
# the sha256 of every file listed by the PyPI JSON API for the new release.
setuptools==84.0.0 \
    --hash=sha256:51a52592b3b99e102b609654876bd65f19f999935166d1352678931132b0c670 \
    --hash=sha256:f4695c21257f0d9b537ec2692c941d02ee143b7cc1276941349a546573b2ef73
